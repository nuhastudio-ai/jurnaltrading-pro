<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Forex Journal Pro</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg0);}
  .login-box{width:100%;max-width:380px;padding:32px 28px;background:var(--bg1);border:1px solid var(--bdr);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;}
  .login-icon{font-size:44px;margin-bottom:8px;}
  .login-title{font-family:var(--fn-h);font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff,var(--c-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
  .login-sub{font-size:12px;color:var(--txt2);margin-bottom:26px;}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;background:#fff;color:#1f1f1f;border:none;border-radius:24px;font-family:var(--fn-b);font-size:13.5px;font-weight:700;cursor:pointer;transition:box-shadow .15s;}
  .gbtn:hover{box-shadow:0 2px 12px rgba(255,255,255,.15);}
  .gbtn img{width:18px;height:18px;}
  .login-msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-top:14px;text-align:left;line-height:1.5;}
  .login-msg.err{background:var(--c-red-d);color:var(--c-red2);border:1px solid rgba(239,68,68,.25);}
  .pending-view{display:none;}
  .spinner{width:22px;height:22px;border:2.5px solid var(--bdr);border-top-color:var(--c-gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}

  /* ═══ PENDING VIEW — animasi orbit + partikel ═══ */
  #pendingView{max-width:400px;padding:36px 30px 28px;position:relative;overflow:hidden;}
  #pendingView::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:220px;height:220px;background:radial-gradient(circle,rgba(245,197,24,.16),transparent 70%);pointer-events:none;}
  .p-orbit-wrap{position:relative;width:104px;height:104px;margin:0 auto 18px;}
  .p-orbit-core{position:absolute;inset:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:linear-gradient(135deg,var(--c-gold),var(--c-gold2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 24px rgba(245,197,24,.55),0 0 60px rgba(245,197,24,.22);animation:pCorePulse 1.6s ease-in-out infinite;}
  @keyframes pCorePulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.08);}}
  .p-orbit-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;animation:pOrbitSpin linear infinite;}
  .p-orbit-ring::before{content:'';position:absolute;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}
  .p-orbit-r1{border-color:rgba(245,197,24,.16);animation-duration:2.4s;color:var(--c-gold);}
  .p-orbit-r1::before{width:9px;height:9px;top:-4.5px;left:50%;transform:translateX(-50%);}
  .p-orbit-r2{inset:14px;border-color:rgba(52,211,153,.14);animation-duration:3.2s;animation-direction:reverse;color:var(--c-green2);}
  .p-orbit-r2::before{width:6px;height:6px;top:-3px;left:50%;transform:translateX(-50%);}
  @keyframes pOrbitSpin{to{transform:rotate(360deg);}}
  .p-particles{position:absolute;inset:-16px;pointer-events:none;}
  .p-particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--c-gold);opacity:0;animation:pParticleFly 2.6s ease-in-out infinite;}
  .p-particle:nth-child(1){top:8%;left:50%;animation-delay:0s;--dx:0px;--dy:-32px;}
  .p-particle:nth-child(2){top:50%;right:2%;animation-delay:.4s;--dx:32px;--dy:0px;background:var(--c-green2);}
  .p-particle:nth-child(3){bottom:8%;left:50%;animation-delay:.8s;--dx:0px;--dy:32px;}
  .p-particle:nth-child(4){top:50%;left:2%;animation-delay:1.2s;--dx:-32px;--dy:0px;background:var(--c-green2);}
  .p-particle:nth-child(5){top:18%;right:14%;animation-delay:.2s;--dx:24px;--dy:-24px;background:#fce27a;}
  .p-particle:nth-child(6){bottom:18%;left:14%;animation-delay:1.6s;--dx:-24px;--dy:24px;}
  @keyframes pParticleFly{0%{opacity:0;transform:scale(0) translate(0,0);}30%{opacity:1;}100%{opacity:0;transform:scale(1.4) translate(var(--dx,20px),var(--dy,-30px));}}
  .p-ticker{min-height:32px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .p-ticker-text{font-size:11.5px;color:var(--txt1);line-height:1.5;animation:pTickerFade .5s ease;}
  @keyframes pTickerFade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .p-steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 4px;}
  .p-step-dot{width:6px;height:6px;border-radius:50%;background:var(--bdr2);transition:all .3s;}
  .p-step-dot.done{background:var(--c-green2);box-shadow:0 0 6px rgba(52,211,153,.6);}
  .p-step-dot.now{background:var(--c-gold);box-shadow:0 0 8px rgba(245,197,24,.7);animation:pCorePulse 1s ease-in-out infinite;}
  .p-account-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:20px;padding:5px 12px 5px 5px;margin:10px 0 4px;max-width:100%;}
  .p-account-chip img{width:22px;height:22px;border-radius:50%;}
  .p-account-chip span{font-size:11px;font-weight:600;color:var(--txt1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>

<div class="login-box" id="loginView">
  <div class="login-icon">📊</div>
  <div class="login-title">Forex Journal Pro</div>
  <div class="login-sub">Masuk dengan akun Google kamu untuk lanjut.</div>
  <button class="gbtn" onclick="doGoogleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    Masuk dengan Google
  </button>
  <div id="loginMsgBox"></div>
</div>

<div class="login-box pending-view" id="pendingView">
  <div class="p-orbit-wrap">
    <div class="p-particles">
      <div class="p-particle"></div><div class="p-particle"></div><div class="p-particle"></div>
      <div class="p-particle"></div><div class="p-particle"></div><div class="p-particle"></div>
    </div>
    <div class="p-orbit-ring p-orbit-r1"></div>
    <div class="p-orbit-ring p-orbit-r2"></div>
    <div class="p-orbit-core">⏳</div>
  </div>
  <div class="login-title">Menunggu Persetujuan</div>
  <div class="p-account-chip" id="pendingAccountChip" style="display:none;">
    <img id="pendingAccountPic" src="" alt="">
    <span id="pendingAccountEmail"></span>
  </div>
  <div class="p-steps">
    <div class="p-step-dot done"></div>
    <div class="p-step-dot now"></div>
    <div class="p-step-dot"></div>
  </div>
  <div class="p-ticker"><div class="p-ticker-text" id="pendingText">Akun kamu sudah terdaftar dan sedang menunggu persetujuan admin.</div></div>
  <button class="btn btn-gold" style="width:100%;margin-top:12px;" onclick="checkStatusAgain()">🔄 Cek Status Lagi</button>
  <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="doLogout()">Keluar / Ganti Akun</button>
</div>

<div class="login-box hidden" id="checkingView">
  <div class="spinner"></div>
  <div class="login-sub" style="margin-top:14px;margin-bottom:0;">Memeriksa sesi...</div>
</div>

<!-- Firebase SDK (versi "compat" — bisa dipakai via <script> biasa, tanpa perlu bundler/import) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/00-firebase-config.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  LOGIN — Firebase Auth (Google provider)
// ══════════════════════════════════════════════════════════
const auth = firebase.auth();
const db   = firebase.firestore();

function show(id) {
  ['loginView', 'pendingView', 'checkingView'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}
function showMsg(text) {
  document.getElementById('loginMsgBox').innerHTML = `<div class="login-msg err">${text}</div>`;
}

async function doGoogleLogin() {
  show('checkingView');
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    // Pakai POPUP, bukan redirect. signInWithRedirect melewati domain
    // "jurnal-trading-pro26.firebaseapp.com" sebagai lompatan (bounce) terpisah
    // dari domain app (Vercel) — browser modern (Chrome bounce-tracking
    // mitigations, ITP Safari/Firefox, dst) makin sering memblokir/menghapus
    // state domain perantara itu, sehingga hasil login hilang TANPA error apapun
    // (user "kelihatannya" login tapi dokumen /users/{uid} tidak pernah dibuat).
    // Popup tidak punya masalah ini karena semuanya terjadi di window terpisah,
    // bukan navigasi lintas domain berantai. vercel.json project ini sudah
    // menyediakan header COOP (same-origin-allow-popups) yang dibutuhkan
    // supaya popup bisa berkomunikasi balik ke window utama dengan lancar.
    const result = await auth.signInWithPopup(provider);
    if (result && result.user) {
      await onLoggedIn(result.user);
    } else {
      show('loginView');
    }
  } catch (e) {
    show('loginView');
    if (e.code === 'auth/popup-blocked') {
      showMsg('❌ Popup diblokir browser. Izinkan popup untuk situs ini lalu coba lagi.');
    } else if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      // User menutup popup sendiri — tidak perlu tampilkan pesan error.
    } else {
      showMsg('❌ Gagal login: ' + e.message);
    }
  }
}

/**
 * Dipanggil setiap kali ada user Firebase yang berhasil auth.
 * Mengecek/membuat dokumen profil di /users/{uid}, lalu tentukan langkah selanjutnya
 * berdasarkan status: active → masuk ke index.html, pending/inactive → tampilkan info.
 */
async function onLoggedIn(user) {
  try {
    const ref = db.collection('users').doc(user.uid);
    const snap = await ref.get();

    if (!snap.exists) {
      // Pendaftaran otomatis pertama kali — status default 'pending', role 'member'
      await ref.set({
        email: user.email,
        name: user.displayName || user.email,
        picture: user.photoURL || '',
        role: 'member',
        status: 'pending',
        daftar: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    const profileSnap = await ref.get();
    const profile = profileSnap.data();

    if (!profile) {
      show('loginView');
      showMsg('❌ Profil user tidak ditemukan setelah dibuat. Coba lagi.');
      return;
    }

    if (profile.status === 'active') {
      location.href = 'index.html';
      return;
    }
    if (profile.status === 'pending') {
      showPendingAccount(profile);
      startPendingTicker();
      startPendingAutoCheck();
      show('pendingView');
      return;
    }
    if (profile.status === 'inactive') {
      stopPendingTicker(); stopPendingAutoCheck();
      showPendingAccount(profile);
      document.getElementById('pendingText').textContent = 'Akun kamu sudah dinonaktifkan. Hubungi admin kalau ini keliru.';
      show('pendingView');
      return;
    }
    show('loginView');
    showMsg('❌ Status akun tidak diketahui: ' + profile.status);
  } catch (e) {
    console.error('onLoggedIn error:', e);
    show('loginView');
    showMsg('❌ Terjadi error: ' + e.message);
  }
}

async function checkStatusAgain() {
  show('checkingView');
  const user = auth.currentUser;
  if (!user) { show('loginView'); return; }
  await onLoggedIn(user);
}

function doLogout() {
  stopPendingTicker(); stopPendingAutoCheck();
  auth.signOut().then(() => { show('loginView'); });
}

/** Tampilkan foto profil + email di kartu kecil pada layar "Menunggu Persetujuan" */
function showPendingAccount(profile) {
  const chip = document.getElementById('pendingAccountChip');
  const pic  = document.getElementById('pendingAccountPic');
  const email = document.getElementById('pendingAccountEmail');
  if (!chip) return;
  email.textContent = profile.email || '';
  if (profile.picture) { pic.src = profile.picture; pic.style.display = 'inline-block'; }
  else { pic.style.display = 'none'; }
  chip.style.display = 'inline-flex';
}

// ── Pesan berganti-ganti di layar "Menunggu Persetujuan" ───────────────
const PENDING_MESSAGES = [
  'Akun kamu sudah terdaftar dan sedang menunggu persetujuan admin.',
  '⏱️ Biasanya tidak butuh waktu lama — sabar ya!',
  '🔔 Admin akan mendapat notifikasi tentang pendaftaran kamu.',
  '🚀 Begitu disetujui, kamu bisa langsung mulai mencatat trading.',
  '👀 Halaman ini otomatis mengecek status setiap beberapa saat.'
];
let _pendingTickerIdx = 0, _pendingTickerTimer = null, _pendingAutoCheckTimer = null;

function startPendingTicker() {
  stopPendingTicker();
  _pendingTickerIdx = 0;
  _pendingTickerTimer = setInterval(() => {
    _pendingTickerIdx = (_pendingTickerIdx + 1) % PENDING_MESSAGES.length;
    const el = document.getElementById('pendingText');
    if (!el) return;
    el.style.animation = 'none';
    // force reflow supaya animasi fade bisa diulang tiap ganti teks
    void el.offsetWidth;
    el.textContent = PENDING_MESSAGES[_pendingTickerIdx];
    el.style.animation = 'pTickerFade .5s ease';
  }, 3800);
}
function stopPendingTicker() {
  if (_pendingTickerTimer) { clearInterval(_pendingTickerTimer); _pendingTickerTimer = null; }
}

/** Cek status ke Firestore tiap 12 detik selagi user diam di layar pending — supaya begitu
 *  admin approve, user otomatis kebawa masuk ke index.html tanpa perlu klik apa-apa. */
function startPendingAutoCheck() {
  stopPendingAutoCheck();
  _pendingAutoCheckTimer = setInterval(async () => {
    const user = auth.currentUser;
    if (!user) return;
    const snap = await db.collection('users').doc(user.uid).get();
    const profile = snap.exists ? snap.data() : null;
    if (profile && profile.status === 'active') {
      stopPendingTicker(); stopPendingAutoCheck();
      location.href = 'index.html';
    }
  }, 12000);
}
function stopPendingAutoCheck() {
  if (_pendingAutoCheckTimer) { clearInterval(_pendingAutoCheckTimer); _pendingAutoCheckTimer = null; }
}

// Tangkap hasil/error dari signInWithRedirect (kalau ada masalah spesifik saat redirect balik)
auth.getRedirectResult().catch(e => {
  console.error('getRedirectResult error:', e);
  show('loginView');
  showMsg('❌ Gagal login: ' + e.message);
});

// Kalau sesi Firebase masih aktif (browser reload / redirect balik dari Google), langsung cek status
auth.onAuthStateChanged(user => {
  if (user) { show('checkingView'); onLoggedIn(user); }
  else { show('loginView'); }
});
</script>
</body>
</html>
