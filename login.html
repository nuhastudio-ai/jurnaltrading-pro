<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Forex Journal Pro</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg0);}
  .login-box{width:100%;max-width:380px;padding:32px 28px;background:var(--bg1);border:1px solid var(--bdr);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;}
  .login-icon{font-size:44px;margin-bottom:8px;}
  .login-title{font-family:var(--fn-h);font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff,var(--c-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
  .login-sub{font-size:12px;color:var(--txt2);margin-bottom:26px;}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;background:#fff;color:#1f1f1f;border:none;border-radius:24px;font-family:var(--fn-b);font-size:13.5px;font-weight:700;cursor:pointer;transition:box-shadow .15s;}
  .gbtn:hover{box-shadow:0 2px 12px rgba(255,255,255,.15);}
  .gbtn img{width:18px;height:18px;}
  .login-msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-top:14px;text-align:left;line-height:1.5;}
  .login-msg.err{background:var(--c-red-d);color:var(--c-red2);border:1px solid rgba(239,68,68,.25);}
  .pending-view{display:none;}
  .spinner{width:22px;height:22px;border:2.5px solid var(--bdr);border-top-color:var(--c-gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="login-box" id="loginView">
  <div class="login-icon">📊</div>
  <div class="login-title">Forex Journal Pro</div>
  <div class="login-sub">Masuk dengan akun Google kamu untuk lanjut.</div>
  <button class="gbtn" onclick="doGoogleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    Masuk dengan Google
  </button>
  <div id="loginMsgBox"></div>
</div>

<div class="login-box pending-view" id="pendingView">
  <div class="login-icon">⏳</div>
  <div class="login-title">Menunggu Persetujuan</div>
  <div class="login-sub" id="pendingText">Akun kamu sudah terdaftar dan sedang menunggu persetujuan admin.</div>
  <button class="btn btn-gold" style="width:100%;margin-top:6px;" onclick="checkStatusAgain()">🔄 Cek Status Lagi</button>
  <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="doLogout()">Keluar / Ganti Akun</button>
</div>

<div class="login-box hidden" id="checkingView">
  <div class="spinner"></div>
  <div class="login-sub" style="margin-top:14px;margin-bottom:0;">Memeriksa sesi...</div>
</div>

<!-- Firebase SDK (versi "compat" — bisa dipakai via <script> biasa, tanpa perlu bundler/import) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/00-firebase-config.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  LOGIN — Firebase Auth (Google provider)
// ══════════════════════════════════════════════════════════
const auth = firebase.auth();
const db   = firebase.firestore();

function show(id) {
  ['loginView', 'pendingView', 'checkingView'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}
function showMsg(text) {
  document.getElementById('loginMsgBox').innerHTML = `<div class="login-msg err">${text}</div>`;
}

async function doGoogleLogin() {
  show('checkingView');
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    // Jangan panggil onLoggedIn() di sini — biarkan listener onAuthStateChanged
    // di bawah yang menangani, supaya tidak terpanggil dobel/bertabrakan.
  } catch (e) {
    show('loginView');
    showMsg('❌ Gagal login: ' + e.message);
  }
}

/**
 * Dipanggil setiap kali ada user Firebase yang berhasil auth.
 * Mengecek/membuat dokumen profil di /users/{uid}, lalu tentukan langkah selanjutnya
 * berdasarkan status: active → masuk ke index.html, pending/inactive → tampilkan info.
 */
async function onLoggedIn(user) {
  try {
    const ref = db.collection('users').doc(user.uid);
    const snap = await ref.get();

    if (!snap.exists) {
      // Pendaftaran otomatis pertama kali — status default 'pending', role 'member'
      await ref.set({
        email: user.email,
        name: user.displayName || user.email,
        picture: user.photoURL || '',
        role: 'member',
        status: 'pending',
        daftar: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    const profileSnap = await ref.get();
    const profile = profileSnap.data();

    if (!profile) {
      show('loginView');
      showMsg('❌ Profil user tidak ditemukan setelah dibuat. Coba lagi.');
      return;
    }

    if (profile.status === 'active') {
      location.href = 'index.html';
      return;
    }
    if (profile.status === 'pending') {
      document.getElementById('pendingText').textContent =
        'Akun ' + profile.email + ' sudah terdaftar dan sedang menunggu persetujuan admin.';
      show('pendingView');
      return;
    }
    if (profile.status === 'inactive') {
      document.getElementById('pendingText').textContent = 'Akun kamu sudah dinonaktifkan. Hubungi admin kalau ini keliru.';
      show('pendingView');
      return;
    }
    show('loginView');
    showMsg('❌ Status akun tidak diketahui: ' + profile.status);
  } catch (e) {
    console.error('onLoggedIn error:', e);
    show('loginView');
    showMsg('❌ Terjadi error: ' + e.message);
  }
}

async function checkStatusAgain() {
  show('checkingView');
  const user = auth.currentUser;
  if (!user) { show('loginView'); return; }
  await onLoggedIn(user);
}

function doLogout() {
  auth.signOut().then(() => { show('loginView'); });
}

// Kalau sesi Firebase masih aktif (browser reload / buka tab baru), langsung cek status
auth.onAuthStateChanged(user => {
  if (user) { show('checkingView'); onLoggedIn(user); }
  else { show('loginView'); }
});
</script>
</body>
</html>
